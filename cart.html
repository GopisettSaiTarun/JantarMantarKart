<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | JantarMantarKart</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
           COMPACT CART PAGE
        ========================================= */

        .cart-page {
            background: #f7f7f4;
            min-height: 100vh;
        }


        /* CART HEADER */

        .cart-header {
            padding: 55px 6% 30px;
            text-align: center;
        }

        .cart-header .small-title {
            font-size: 9px;
            letter-spacing: 3px;
            font-weight: 800;
            color: #888;
            margin-bottom: 10px;
        }

        .cart-header h1 {
            font-size: clamp(32px, 4vw, 48px);
            line-height: 1;
            letter-spacing: -2px;
            margin: 0;
        }


        /* MAIN */

        .cart-container {
            width: min(1050px, 92%);
            margin: 0 auto 70px;

            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;

            gap: 25px;

            align-items: start;
        }


        /* CART ITEMS */

        #cart-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }


        /*
           These styles target common cart.js
           generated elements.
        */

        #cart-items > div {
            background: #fff;
            border: 1px solid #e7e7e3;
            border-radius: 12px;
            padding: 12px;

            min-height: 100px;

            box-shadow: none;
        }


        #cart-items img {
            width: 82px !important;
            height: 82px !important;

            object-fit: cover;

            border-radius: 9px;
        }


        #cart-items h2,
        #cart-items h3,
        #cart-items h4 {
            font-size: 13px !important;
            line-height: 1.3;
            margin: 0 0 5px;
        }


        #cart-items p {
            font-size: 10px !important;
            line-height: 1.5;
            margin: 3px 0;
        }


        #cart-items button {
            min-height: 30px;

            padding: 6px 10px;

            border-radius: 6px;

            font-size: 9px;

            cursor: pointer;
        }


        /* QUANTITY */

        #cart-items input[type="number"] {
            width: 45px !important;
            height: 30px !important;

            border: 1px solid #ddd;
            border-radius: 6px;

            text-align: center;

            font-size: 10px;
        }


        #cart-items select {
            height: 30px;

            border: 1px solid #ddd;

            border-radius: 6px;

            font-size: 9px;

            padding: 0 7px;
        }


        /* SUMMARY */

        #cart-summary {
            background: #111;
            color: #fff;

            border-radius: 14px;

            padding: 22px;

            position: sticky;
            top: 20px;
        }


        #cart-summary h2,
        #cart-summary h3,
        #cart-summary h4 {
            font-size: 16px !important;
            margin: 0 0 15px;
        }


        #cart-summary p {
            font-size: 10px !important;
            color: #aaa;

            margin: 8px 0;
        }


        #cart-summary strong {
            color: #fff;
        }


        #cart-summary button,
        #cart-summary a {
            display: block;

            width: 100%;

            min-height: 42px;

            border: none;

            border-radius: 7px;

            margin-top: 10px;

            padding: 12px;

            text-align: center;

            text-decoration: none;

            font-size: 9px;

            font-weight: 800;

            cursor: pointer;
        }


        /* EMPTY CART */

        .empty-cart {
            background: #fff;

            border: 1px solid #e7e7e3;

            border-radius: 14px;

            padding: 55px 25px;

            text-align: center;
        }


        .empty-cart h2 {
            font-size: 20px;

            margin-bottom: 8px;
        }


        .empty-cart p {
            color: #888;

            font-size: 10px;

            margin-bottom: 20px;
        }


        .empty-cart a {
            display: inline-block;

            background: #111;

            color: #fff;

            padding: 12px 20px;

            border-radius: 7px;

            text-decoration: none;

            font-size: 9px;

            font-weight: 800;
        }


        /* FOOTER */

        .cart-footer {
            background: #111;

            color: #fff;

            padding: 35px 6%;

            text-align: center;
        }


        .cart-footer h2 {
            font-size: 18px;

            margin-bottom: 7px;
        }


        .cart-footer p {
            color: #888;

            font-size: 9px;

            margin: 5px 0;
        }


        .cart-footer .copyright {
            margin-top: 18px;

            color: #555;
        }


        /* MOBILE */

        @media (max-width: 800px) {

            .cart-header {
                padding: 40px 20px 25px;
            }


            .cart-container {

                width: 94%;

                grid-template-columns: 1fr;

                gap: 15px;

            }


            #cart-summary {

                position: static;

            }

        }


        @media (max-width: 500px) {

            #cart-items img {

                width: 65px !important;

                height: 65px !important;

            }


            #cart-items > div {

                padding: 9px;

            }


            .cart-header h1 {

                font-size: 30px;

            }

        }

    </style>

</head>


<body class="cart-page">


<!-- =========================================
     NAVIGATION
========================================= -->

<header class="site-header">

    <nav class="navbar">

        <a href="index.html" class="brand">

            <span class="brand-main">
                Jantar
            </span>

            <span class="brand-accent">
                Mantar
            </span>

            <span class="brand-main">
                Kart
            </span>

        </a>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="wishlist.html">
                Wishlist
                <span class="nav-count"
                      id="wishlist-count">
                    0
                </span>
            </a>

            <a href="cart.html"
               class="active">

                Cart

                <span class="nav-count"
                      id="cart-count">
                    0
                </span>

            </a>

            <a href="contact.html">
                Contact Us
            </a>

            <a href="#"
               onclick="logout(); return false;">
                Logout
            </a>

        </div>

    </nav>

</header>



<!-- =========================================
     CART HEADER
========================================= -->

<section class="cart-header">

    <p class="small-title">
        JANTARMANTARKART
    </p>

    <h1>
        Your Shopping Cart
    </h1>

</section>



<!-- =========================================
     CART
========================================= -->

<main class="cart-container">

    <div id="cart-items">

        <!-- cart.js loads products here -->

    </div>


    <div id="cart-summary">

        <!-- cart.js loads summary here -->

    </div>

</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer class="cart-footer">

    <h2>
        JantarMantarKart
    </h2>

    <p>
        Your modern destination for everyday shopping.
    </p>

    <p class="copyright">
        © 2026 JantarMantarKart.
        All rights reserved.
    </p>

</footer>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="auth.js"></script>

<script src="cart.js"></script>


<script>

    /* Update cart counter */

    function updateCartPageCount() {

        const cart =
            JSON.parse(
                localStorage.getItem(
                    "jantarMantarKartCart"
                )
            ) || [];


        let count = 0;


        cart.forEach(function(item) {

            count += Number(
                item.quantity || 0
            );

        });


        const cartCount =
            document.getElementById(
                "cart-count"
            );


        if (cartCount) {

            cartCount.textContent =
                count;

        }

    }


    updateCartPageCount();

</script>


</body>

</html>
