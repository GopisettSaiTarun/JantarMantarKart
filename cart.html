<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | JantarMantarKart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- Navigation -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Jantar<span>Mantar</span>Kart
            </div>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="cart.html">
                    Cart 🛒
                    <span id="cart-count">0</span>
                </a>

            </div>

        </nav>

    </header>


    <!-- Cart Header -->

    <section class="cart-header">

        <p class="small-title">
            JANTARMANTARKART
        </p>

        <h1>
            Your Shopping Cart
        </h1>

    </section>


    <!-- Cart -->

    <main class="cart-container">

        <div id="cart-items">

            <!-- Cart products appear here -->

        </div>


        <div id="cart-summary">

            <!-- Cart total appears here -->

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <h2>
            JantarMantarKart
        </h2>

        <p>
            Your modern destination for everyday shopping.
        </p>

        <p class="copyright">
            © 2026 JantarMantarKart. All rights reserved.
        </p>

    </footer>


    <script src="cart.js"></script>

</body>

</html>
