<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Confirmed | JantarMantarKart</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f5f5f2;
            color: #111;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #111;
            padding: 20px 7%;
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 800;
        }

        .brand span {
            color: #b8ff00;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .success-card {
            width: min(600px, 100%);
            background: white;
            border-radius: 20px;
            padding: 45px;
            text-align: center;
            box-shadow:
                0 20px 60px
                rgba(0,0,0,.08);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #111;
            color: #b8ff00;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 35px;
            font-weight: 900;
        }

        .success-card small {
            letter-spacing: 3px;
            color: #777;
            font-weight: 800;
        }

        .success-card h1 {
            font-size: 38px;
            margin: 12px 0;
        }

        .success-card p {
            color: #777;
            line-height: 1.6;
        }

        .order-box {
            background: #f5f5f2;
            border-radius: 12px;
            padding: 18px;
            margin: 25px 0;
        }

        .order-box span {
            display: block;
            color: #888;
            font-size: 11px;
            margin-bottom: 7px;
        }

        .order-box strong {
            font-size: 20px;
            letter-spacing: 1px;
        }

        .buttons {
            display: grid;
            gap: 10px;
        }

        .button {
            display: block;
            text-decoration: none;
            border-radius: 9px;
            padding: 14px;
            font-weight: 800;
            font-size: 13px;
        }

        .track {
            background: #111;
            color: white;
        }

        .shop {
            border: 1px solid #ddd;
            color: #111;
        }

        .track:hover {
            background: #b8ff00;
            color: #111;
        }

        footer {
            background: #111;
            color: #777;
            text-align: center;
            padding: 20px;
            font-size: 11px;
        }

        @media (max-width: 500px) {

            .success-card {
                padding: 30px 20px;
            }

            .success-card h1 {
                font-size: 30px;
            }
        }

    </style>

</head>

<body>

<header>

    <a
        href="index.html"
        class="brand"
    >
        Jantar<span>Mantar</span>Kart
    </a>

</header>

<main>

    <section class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <small>
            ORDER CONFIRMED
        </small>

        <h1>
            Thank You!
        </h1>

        <p>
            Your order has been successfully placed.
            You can now track your delivery.
        </p>

        <div class="order-box">

            <span>
                YOUR ORDER ID
            </span>

            <strong id="successOrderId">
                Loading...
            </strong>

        </div>

        <div class="buttons">

            <a
                href="track-order.html"
                class="button track"
            >
                📦 Track My Order
            </a>

            <a
                href="products.html"
                class="button shop"
            >
                Continue Shopping
            </a>

        </div>

    </section>

</main>

<footer>

    © 2026 JantarMantarKart.
    All rights reserved.

</footer>

<script>

    const lastOrder =
        JSON.parse(
            localStorage.getItem(
                "jantarMantarKartLastOrder"
            )
        );

    const orderIdElement =
        document.getElementById(
            "successOrderId"
        );

    if (lastOrder) {

        orderIdElement.textContent =
            lastOrder.id;

    } else {

        orderIdElement.textContent =
            "Order not found";

    }

</script>

</body>

</html>
