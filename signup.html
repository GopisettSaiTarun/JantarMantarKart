<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up | JantarMantarKart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <div class="logo">
                Jantar<span>Mantar</span>Kart
            </div>

            <p class="small-title">
                JANTARMANTARKART
            </p>

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Create your account to continue shopping.
            </p>


            <form id="signup-form">

                <label for="signup-name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signup-name"
                    placeholder="Enter your name"
                    required
                >


                <label for="signup-email">
                    Email
                </label>

                <input
                    type="email"
                    id="signup-email"
                    placeholder="Enter your email"
                    required
                >


                <label for="signup-password">
                    Password
                </label>

                <input
                    type="password"
                    id="signup-password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <p
                id="signup-message"
                class="auth-message"
            ></p>


            <p class="auth-footer">

                Already have an account?

                <a href="signin.html">
                    Sign In
                </a>

            </p>

        </div>

    </main>


    <!-- Authentication JavaScript -->

    <script src="auth.js"></script>


    <!-- Signup JavaScript -->

    <script>

        const signupForm =
            document.getElementById("signup-form");


        const signupMessage =
            document.getElementById("signup-message");


        signupForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "signup-name"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "signup-email"
                    ).value.trim().toLowerCase();


                const password =
                    document.getElementById(
                        "signup-password"
                    ).value;


                // Get existing users

                const users = getUsers();


                // Check existing email

                const existingUser =
                    users.find(function(user) {

                        return user.email === email;

                    });


                if (existingUser) {

                    signupMessage.textContent =
                        "An account with this email already exists.";

                    signupMessage.style.color =
                        "red";

                    return;

                }


                // Create user

                const newUser = {

                    name: name,

                    email: email,

                    password: password

                };


                // Add user to array

                users.push(newUser);


                // Save users to LocalStorage

                saveUsers(users);


                // Success message

                signupMessage.textContent =
                    "Account created successfully!";

                signupMessage.style.color =
                    "green";


                // Redirect to Sign In

                setTimeout(function() {

                    window.location.href =
                        "signin.html";

                }, 1000);

            }
        );

    </script>

</body>

</html>
