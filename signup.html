<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up | JantarMantarKart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header>

    <nav class="navbar">

        <div class="logo">
            Jantar<span>Mantar</span>Kart
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart 🛒
            </a>

        </div>

    </nav>

</header>


<main class="auth-container">

    <div class="auth-card">

        <p class="small-title">
            JANTARMANTARKART
        </p>

        <h1>
            Create Account
        </h1>

        <p class="auth-subtitle">
            Create your account to continue shopping.
        </p>


        <form id="signup-form">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="signup-name"
                placeholder="Enter your name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="signup-email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="signup-password"
                placeholder="Create a password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>

        </form>


        <p
            id="signup-message"
            class="auth-message"
        ></p>


        <p class="auth-footer">

            Already have an account?

            <a href="signin.html">
                Sign In
            </a>

        </p>

    </div>

</main>


<script src="auth.js"></script>

<script>

const signupForm =
    document.getElementById("signup-form");


signupForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
            document.getElementById(
                "signup-name"
            ).value.trim();


        const email =
            document.getElementById(
                "signup-email"
            ).value.trim().toLowerCase();


        const password =
            document.getElementById(
                "signup-password"
            ).value;


        const message =
            document.getElementById(
                "signup-message"
            );


        const users = getUsers();


        const existingUser =
            users.find(
                user => user.email === email
            );


        if (existingUser) {

            message.textContent =
                "An account with this email already exists.";

            message.className =
                "auth-message error";

            return;

        }


        const newUser = {

            id: Date.now(),

            name: name,

            email: email,

            password: password

        };


        users.push(newUser);


        saveUsers(users);


        message.textContent =
            "Account created successfully!";

        message.className =
            "auth-message success";


        setTimeout(function() {

            window.location.href =
                "signin.html";

        }, 1000);

    }

);

</script>


</body>

</html>
