<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In | JantarMantarKart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <div class="logo">
                Jantar<span>Mantar</span>Kart
            </div>

            <p class="small-title">
                WELCOME BACK
            </p>

            <h1>
                Sign In
            </h1>

            <p class="auth-subtitle">
                Sign in to continue to checkout.
            </p>


            <form id="signin-form">

                <label for="signin-email">
                    Email
                </label>

                <input
                    type="email"
                    id="signin-email"
                    placeholder="Enter your email"
                    required
                >


                <label for="signin-password">
                    Password
                </label>

                <input
                    type="password"
                    id="signin-password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="auth-button"
                >
                    Sign In
                </button>

            </form>


            <p
                id="signin-message"
                class="auth-message"
            ></p>


            <p class="auth-footer">

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </p>


            <p class="auth-footer">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>


    <script src="auth.js"></script>


    <script>

        const signinForm =
            document.getElementById("signin-form");

        const signinMessage =
            document.getElementById("signin-message");


        signinForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "signin-email"
                    ).value.trim().toLowerCase();


                const password =
                    document.getElementById(
                        "signin-password"
                    ).value;


                const users = getUsers();


                const user =
                    users.find(function(user) {

                        return (
                            user.email === email &&
                            user.password === password
                        );

                    });


                if (!user) {

                    signinMessage.textContent =
                        "Invalid email or password.";

                    signinMessage.style.color =
                        "red";

                    return;

                }


                // Save current user

                localStorage.setItem(
                    "jantarMantarKartCurrentUser",
                    JSON.stringify(user)
                );


                signinMessage.textContent =
                    "Sign in successful!";

                signinMessage.style.color =
                    "green";


                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 800);

            }
        );

    </script>

</body>

</html>
