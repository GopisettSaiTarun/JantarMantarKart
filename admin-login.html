<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JantarMantarKart | Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .logo {
            width: 55px;
            height: 55px;
            margin: 0 auto 12px;
            border-radius: 15px;
            background: #c8ff38;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
        }

        .brand h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .brand p {
            color: #777;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 32px;
        }

        .login-card .label {
            color: #999;
            font-size: 9px;
            letter-spacing: 1.5px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .login-card h2 {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #888;
            font-size: 11px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 12px;
        }

        input:focus {
            border-color: #111;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 55px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #777;
            font-size: 10px;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #111;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #333;
        }

        .error {
            display: none;
            background: #fff0f0;
            color: #d33;
            padding: 10px;
            border-radius: 7px;
            font-size: 10px;
            margin-bottom: 15px;
        }

        .back-store {
            display: block;
            text-align: center;
            color: #777;
            text-decoration: none;
            font-size: 10px;
            margin-top: 20px;
        }

        .back-store:hover {
            color: white;
        }

        .demo-info {
            margin-top: 20px;
            padding: 12px;
            background: #f5f5f2;
            border-radius: 8px;
            font-size: 9px;
            color: #777;
            text-align: center;
            line-height: 1.6;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="brand">

        <div class="logo">J</div>

        <h1>JantarMantarKart</h1>

        <p>ADMINISTRATOR ACCESS</p>

    </div>


    <div class="login-card">

        <p class="label">SECURE ACCESS</p>

        <h2>Welcome back</h2>

        <p class="subtitle">
            Sign in to manage your store.
        </p>


        <div id="loginError" class="error">
            Invalid admin credentials.
        </div>


        <form id="adminLoginForm">

            <div class="form-group">

                <label for="adminUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="adminUsername"
                    placeholder="Enter admin username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="adminPassword">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                SIGN IN TO ADMIN
            </button>

        </form>


        <div class="demo-info">
            Demo login<br>
            Username: <strong>admin</strong><br>
            Password: <strong>admin123</strong>
        </div>

    </div>


    <a href="index.html" class="back-store">
        ← Back to JantarMantarKart
    </a>

</div>


<script>

    /*
     * DEMO ADMIN LOGIN
     *
     * IMPORTANT:
     * This is frontend/localStorage authentication.
     * It is suitable for your project demo,
     * but NOT for a real production store.
     */

    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "admin123";


    // If already logged in, go directly to dashboard
    if (
        localStorage.getItem(
            "jantarMantarKartAdminLoggedIn"
        ) === "true"
    ) {

        window.location.href = "admin.html";

    }


    document
        .getElementById("adminLoginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const username =
                document
                    .getElementById("adminUsername")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("adminPassword")
                    .value;


            const error =
                document.getElementById("loginError");


            if (
                username === ADMIN_USERNAME &&
                password === ADMIN_PASSWORD
            ) {

                localStorage.setItem(
                    "jantarMantarKartAdminLoggedIn",
                    "true"
                );

                window.location.href =
                    "admin.html";

            } else {

                error.style.display = "block";

                document
                    .getElementById("adminPassword")
                    .value = "";

            }

        });


    function togglePassword() {

        const password =
            document.getElementById("adminPassword");

        const button =
            document.querySelector(".show-password");


        if (password.type === "password") {

            password.type = "text";

            button.textContent = "HIDE";

        } else {

            password.type = "password";

            button.textContent = "SHOW";

        }

    }

</script>

</body>
</html>
