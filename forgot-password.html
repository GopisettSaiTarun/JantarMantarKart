<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | JantarMantarKart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <div class="logo">
                Jantar<span>Mantar</span>Kart
            </div>

            <p class="small-title">
                ACCOUNT RECOVERY
            </p>

            <h1>
                Reset Password
            </h1>

            <p class="auth-subtitle">
                Enter your registered email and choose a new password.
            </p>


            <form id="forgot-password-form">

                <label for="reset-email">
                    Email
                </label>

                <input
                    type="email"
                    id="reset-email"
                    placeholder="Enter your registered email"
                    required
                >


                <label for="new-password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new-password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >


                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="auth-button"
                >
                    Reset Password
                </button>

            </form>


            <p
                id="reset-message"
                class="auth-message"
            ></p>


            <p class="auth-footer">

                Remember your password?

                <a href="signin.html">
                    Sign In
                </a>

            </p>

        </div>

    </main>


    <script src="auth.js"></script>


    <script>

        const resetForm =
            document.getElementById(
                "forgot-password-form"
            );


        const resetMessage =
            document.getElementById(
                "reset-message"
            );


        resetForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "reset-email"
                    ).value.trim().toLowerCase();


                const newPassword =
                    document.getElementById(
                        "new-password"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirm-password"
                    ).value;


                // Check passwords

                if (
                    newPassword !==
                    confirmPassword
                ) {

                    resetMessage.textContent =
                        "Passwords do not match.";

                    resetMessage.style.color =
                        "red";

                    return;

                }


                // Get users

                const users = getUsers();


                // Find user

                const userIndex =
                    users.findIndex(
                        function(user) {

                            return (
                                user.email === email
                            );

                        }
                    );


                // User doesn't exist

                if (userIndex === -1) {

                    resetMessage.textContent =
                        "No account found with this email.";

                    resetMessage.style.color =
                        "red";

                    return;

                }


                // Update password

                users[userIndex].password =
                    newPassword;


                // Save users

                saveUsers(users);


                resetMessage.textContent =
                    "Password reset successfully!";

                resetMessage.style.color =
                    "green";


                // Go to Sign In

                setTimeout(function() {

                    window.location.href =
                        "signin.html";

                }, 1000);

            }
        );

    </script>

</body>

</html>
